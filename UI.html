    @keyframes dot-bounce {

      }

<script>
  const API_BASE = '';
  
  (function initAxonApp() {
    const textarea = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-button');
    const stream = document.getElementById('chat-stream');
    const welcomeBlock = document.getElementById('welcome-block');
    const workingIndicator = document.getElementById('working-indicator');
    const workingText = document.getElementById('working-text');
    const newChatBtn = document.getElementById('btn-new-chat');
    const togglePinnedBtn = document.getElementById('toggle-pinned-btn');
    const pinnedChevron = document.getElementById('pinned-chevron');
    const pinnedListEl = document.getElementById('pinned-list');
    const recentsListEl = document.getElementById('recents-list');
    const goldenGlowBg = document.getElementById('golden-glow-bg');
    const osirisContainer = document.getElementById('osiris-container');
    const osirisIframe = document.getElementById('osiris-iframe');

    window.toggleKnowTheWorld = function() {
      if (osirisContainer.classList.contains('opacity-0')) {
        osirisContainer.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
        osirisContainer.classList.add('opacity-100', 'translate-y-0');
        if (osirisIframe.src === 'about:blank' || osirisIframe.src === window.location.href) {
          osirisIframe.src = osirisIframe.getAttribute('data-src');
        }
      } else {
        osirisContainer.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
        osirisContainer.classList.remove('opacity-100', 'translate-y-0');
      }
    };

    function updateBackgroundGlow(show) {
      if (!goldenGlowBg) return;
      if (show) {
        goldenGlowBg.classList.remove('opacity-0');
        goldenGlowBg.classList.add('opacity-100');
      } else {
        goldenGlowBg.classList.remove('opacity-100');
        goldenGlowBg.classList.add('opacity-0');
      }
    }

    const DEFAULT_SEED_CONVERSATIONS = [
      {
        id: "conv-1",
        title: "Axonic Workspace Setup",
        pinned: true,
        updated_at: Date.now() - 30000,
        messages: [
          { role: "user", content: "Set up the Axonic workspace with tools and memory." },
          { role: "assistant", content: "Axonic workspace is configured with full tool registry, persistent memory, and security gatekeeping." }
        ]
      },
      {
        id: "conv-2",
        title: "Logo Animation Professional Ideas",
        pinned: false,
        updated_at: Date.now() - 60000,
        messages: [
          { role: "user", content: "Give me professional ideas for animating the AxonicA logo." },
          { role: "assistant", content: "Here are 3 standout logo animation directions:\n\n1. **Orbital Glow**: Kinetic energy paths revolving around the central star glyph.\n2. **Neumorphic Liquid Fill**: Smooth amber gradient sweeping into the A contours.\n3. **3D Kinetic Spin**: Isometric rotation with subtle metallic highlights." }
        ]
      },
      {
        id: "conv-3",
        title: "Logo Transparent Background Removal",
        pinned: false,
        updated_at: Date.now() - 120000,
        messages: []
      },
      {
        id: "conv-4",
        title: "Changing Yahoo to Google Search",
        pinned: false,
        updated_at: Date.now() - 180000,
        messages: []
      },
      {
        id: "conv-5",
        title: "Movie Identification: Napoleon (2023)",
        pinned: false,
        updated_at: Date.now() - 240000,
        messages: []
      },
      {
        id: "conv-6",
        title: "Fixing Realtek Audio Driver Error",
        pinned: false,
        updated_at: Date.now() - 300000,
        messages: []
      },
      {
        id: "conv-7",
        title: "CCR Authentication Token Error",
        pinned: false,
        updated_at: Date.now() - 360000,
        messages: []
      },
      {
        id: "conv-8",
        title: "Vibe Coding a Parlour Website",
        pinned: false,
        updated_at: Date.now() - 420000,
        messages: []
      }
    ];

    let conversations = [];
    let activeConvId = 'conv-new';
    let pinnedCollapsed = false;

    function saveLocal() {
      // Backend is now the source of truth
    }

    function loadLocal() {
      fetch(API_BASE + '/api/conversations')
        .then(res => res.json())
        .then(data => {
          conversations = data.conversations || [];
          if (!activeConvId || activeConvId === 'conv-new') {
             activeConvId = 'conv-new';
          } else if (data.active_id && !conversations.some(c => c.id === activeConvId)) {
             activeConvId = data.active_id;
          }
          renderConversationsList();
          loadActiveConversationMessages();
        })
        .catch(e => console.error(e));
    }

    function renderConversationsList() {
      if (!pinnedListEl || !recentsListEl) return;

      const pinnedItems = conversations.filter(c => c.pinned);
      const recentsItems = conversations.filter(c => !c.pinned);

      pinnedListEl.style.display = pinnedCollapsed ? 'none' : 'block';
      if (pinnedChevron) {
        pinnedChevron.style.transform = pinnedCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)';
      }

      // Pinned render
      if (pinnedItems.length === 0) {
        pinnedListEl.innerHTML = `<div class="px-3 py-1 text-neutral-500 text-xs opacity-60 select-none">No pinned chats</div>`;
      } else {
        pinnedListEl.innerHTML = pinnedItems.map(c => {
          const isActive = c.id === activeConvId;
          const bgClass = isActive ? 'bg-[#282a2c] text-white' : 'text-neutral-300 hover:bg-[#282a2c]/60 hover:text-white';
          return `
            <div class="group relative flex items-center justify-between px-3 py-2 rounded-xl cursor-pointer transition-colors ${bgClass}" onclick="window.selectConversation('${c.id}')" title="${escapeHtml(c.title)}">
              <div class="flex items-center gap-2.5 truncate min-w-0">

                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M18 12H6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>

                <button class="w-5 h-5 flex items-center justify-center rounded hover:bg-[#313336] text-neutral-400 hover:text-rose-400" onclick="event.stopPropagation(); window.deleteConversation('${c.id}')" title="Delete">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
                </button>

            </div>
          `;
        }).join('');

      // Recents render
      if (recentsItems.length === 0) {

          return `
            <div class="group relative flex items-center justify-between px-3 py-2 rounded-xl cursor-pointer transition-colors ${bgClass}" onclick="window.selectConversation('${c.id}')" title="${escapeHtml(c.title)}">

              <div class="flex items-center gap-1 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity ml-1">
                <button class="w-5 h-5 flex items-center justify-center rounded hover:bg-[#313336] text-neutral-400 hover:text-white" onclick="event.stopPropagation(); window.togglePinConversation('${c.id}')" title="Pin">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
                </button>
                <button class="w-5 h-5 flex items-center justify-center rounded hover:bg-[#313336] text-neutral-400 hover:text-rose-400" onclick="event.stopPropagation(); window.deleteConversation('${c.id}')" title="Delete">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

    function loadActiveConversationMessages() {
      const existingRows = stream.querySelectorAll('.chat-msg-row');
      existingRows.forEach(r => r.remove());

      if (activeConvId === 'conv-new') {
        welcomeBlock.classList.remove('hidden');
        welcomeBlock.classList.add('flex');
        stream.classList.add('hidden');
        stream.classList.remove('flex');
        if (textarea) textarea.value = '';
        updateBackgroundGlow(true);
        return;
      }

      const conv = conversations.find(c => c.id === activeConvId);
      if (!conv || !conv.messages || conv.messages.length === 0) {
        welcomeBlock.classList.remove('hidden');
        welcomeBlock.classList.add('flex');
        stream.classList.add('hidden');
        stream.classList.remove('flex');
        updateBackgroundGlow(true);
      } else {
        welcomeBlock.classList.add('hidden');
        welcomeBlock.classList.remove('flex');
        stream.classList.remove('hidden');
        stream.classList.add('flex');
        updateBackgroundGlow(false);
        conv.messages.forEach(msg => {
          if (msg.role === 'user') {
            appendUserMessage(msg.content, msg.timestamp, false);
          } else {
            appendAxonResponse(msg.content, msg.tools || [], msg.timestamp, false);
          }
        });
        scrollToBottom();
      }
    }

    window.selectConversation = function(id) {
      if (id === activeConvId) return;
      activeConvId = id;
      renderConversationsList();
      loadActiveConversationMessages();
      saveLocal();

      fetch(API_BASE + '/api/conversations/active', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id })
      }).catch(() => {});
    };

    window.togglePinConversation = function(id) {
      const conv = conversations.find(c => c.id === id);
      if (!conv) return;
      conv.pinned = !conv.pinned;
      conv.updated_at = Date.now();
      renderConversationsList();
      saveLocal();

      fetch(API_BASE + '/api/conversations/' + encodeURIComponent(id) + '/pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pinned: conv.pinned })
      }).catch(() => {});
    };

    window.deleteConversation = function(id) {
      const idx = conversations.findIndex(c => c.id === id);
      if (idx === -1) return;
      conversations.splice(idx, 1);
      if (activeConvId === id) {
        window.createNewConversation();
      } else {
        renderConversationsList();
      }

      fetch(API_BASE + '/api/conversations/' + encodeURIComponent(id) + '/delete', {
        method: 'POST'
      }).then(() => loadLocal()).catch(() => {});
    };

    window.createNewConversation = function() {
      activeConvId = 'conv-new';
      renderConversationsList();
      loadActiveConversationMessages();
      saveLocal();
      textarea.value = '';
      textarea.focus();
    };

    if (newChatBtn) newChatBtn.addEventListener('click', window.createNewConversation);

    if (togglePinnedBtn) {
      togglePinnedBtn.addEventListener('click', () => {
        pinnedCollapsed = !pinnedCollapsed;
        renderConversationsList();
      });
    }

    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') {
        e.preventDefault();
        window.createNewConversation();
      }
    });

    function getTimeStamp() {
      const now = new Date();
      return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
      stream.scrollTop = stream.scrollHeight;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderMarkdown(text) {
      if (!text) return '';
      let out = escapeHtml(text);

      // Code blocks: ```...```
      out = out.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (match, lang, code) => {
        const cleanCode = code.trim();
        return `
          <div class="relative group/code my-3 rounded-xl overflow-hidden border border-white/10 bg-[#1e1f20]">
            <div class="flex items-center justify-between px-3 py-1.5 bg-[#282a2c] border-b border-white/5 text-[11px] font-mono text-neutral-400 select-none">
              <span class="font-medium text-amber-400/90">${lang || 'code'}</span>
              <button type="button" class="copy-code-btn flex items-center gap-1 hover:text-white transition-colors cursor-pointer text-neutral-400 px-2 py-0.5 rounded hover:bg-[#313336]" title="Copy code">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
                <span class="copy-label text-[11px]">Copy</span>
              </button>
            </div>
            <pre class="p-3 font-mono text-[13px] text-[#e3e3e3] overflow-x-auto select-text cursor-text m-0"><code class="select-text">${cleanCode}</code></pre>
          </div>
        `;
      });

      // Inline code: `code`
      out = out.replace(/`([^`]+)`/g, '<code class="bg-[#282a2c] px-1.5 py-0.5 rounded text-[13px] font-mono text-amber-300 select-text">$1</code>');

      // Bold: **text**
      out = out.replace(/\*\*([^*]+)\*\*/g, '<strong class="font-semibold text-white">$1</strong>');

      // Headings: ###, ##, #
      out = out.replace(/^### (.*$)/gim, '<h3 class="text-base font-semibold text-white mt-3 mb-1 select-text">$1</h3>');
      out = out.replace(/^## (.*$)/gim, '<h2 class="text-lg font-semibold text-white mt-4 mb-1 select-text">$1</h2>');

      // Bullet lists
      const lines = out.split('\n');
      let inList = false;
      let newLines = [];
      for (let line of lines) {
        if (/^\s*[-*]\s+(.*)/.test(line)) {
          if (!inList) {
            newLines.push('<ul class="list-disc pl-5 my-2 space-y-1 text-neutral-300 select-text">');
            inList = true;
          }
          newLines.push(line.replace(/^\s*[-*]\s+(.*)/, '<li class="text-neutral-300 select-text">$1</li>'));
        } else {
          if (inList) {
            newLines.push('</ul>');
            inList = false;
          }
          newLines.push(line);
        }
      }
      if (inList) newLines.push('</ul>');
      out = newLines.join('\n');

      // Paragraph breaks
      out = out.replace(/\n\n+/g, '</p><p class="mb-2 last:mb-0 select-text">');
      out = '<p class="mb-2 last:mb-0 select-text">' + out + '</p>';
      return out;
    }

          <button type="button" class="copy-btn opacity-0 group-hover/msg:opacity-100 focus:opacity-100 transition-opacity mt-1 flex items-center gap-1 text-[11px] text-neutral-400 hover:text-white px-2 py-0.5 rounded cursor-pointer select-none" title="Copy message">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>

    window.respondApproval = function(reqId, approved) {
      const actionsEl = document.getElementById('approval-actions-' + reqId);
      if (actionsEl) {
        actionsEl.innerHTML = approved
          ? '<span class="text-xs text-amber-400 font-mono">✓ Approved — executing tool...</span>'
          : '<span class="text-xs text-neutral-500 font-mono">✗ Denied by user.</span>';
      }
      fetch(API_BASE + '/api/approve', {
        method: 'POST',

    function setWorkingStatus(text) {
      if (!workingText) return;
      const clean = (text || 'Thinking').replace(/\.+$/, '');
      workingText.textContent = clean;
    }

    async function sendPrompt(text) {
      appendUserMessage(text, getTimeStamp(), true);
      textarea.value = '';

      setWorkingStatus('Thinking');
      workingIndicator.classList.remove('hidden');
      workingIndicator.classList.add('flex');
      scrollToBottom();

      try {
        const response = await fetch(API_BASE + '/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, stream: true, conversation_id: activeConvId })
        });

        if (!response.ok) {
          throw new Error('HTTP ' + response.status + ' ' + response.statusText);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let toolsCollected = [];
        let finalResponse = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed) continue;
            try {
              const event = JSON.parse(trimmed);
              if (event.type === 'status') {
                setWorkingStatus(event.text || 'Working');
              } else if (event.type === 'tool_start') {
                setWorkingStatus('Using ' + event.tool);
                toolsCollected.push({ name: event.tool, status: 'running' });
              } else if (event.type === 'tool_done') {
                setWorkingStatus('Completed ' + event.tool);
              } else if (event.type === 'approval_required') {
                setWorkingStatus('Waiting for approval');
                renderApprovalCard(event.id, event.tool, event.args);
              } else if (event.type === 'done') {
                finalResponse = event.response || '';
                if (event.tools) toolsCollected = event.tools;
                if (event.conversation_id && event.conversation_id !== activeConvId) {
                  const oldId = activeConvId;
                  activeConvId = event.conversation_id;
                  const conv = conversations.find(c => c.id === oldId);
                  if (conv) conv.id = activeConvId;
                  renderConversationsList();
                  loadLocal(); // refresh full state from backend
                }
              } else if (event.type === 'error') {
                throw new Error(event.error || 'Server error');
              }
            } catch (jsonErr) {
              if (jsonErr.message && !jsonErr.message.includes('JSON')) throw jsonErr;
            }
          }
        }

        workingIndicator.classList.add('hidden');
        workingIndicator.classList.remove('flex');

        if (finalResponse) {
          appendAxonResponse(finalResponse, toolsCollected, getTimeStamp(), true);
        }
      } catch (err) {
        workingIndicator.classList.add('hidden');
        workingIndicator.classList.remove('flex');
        const isNetworkErr = err.message === 'Failed to fetch' || err.name === 'TypeError';
        const msg = isNetworkErr
          ? 'Cannot connect to AXON backend. Ensure server is running with: python -m axon web'
          : (err.message || String(err));
        appendAxonError(msg);
      }
    }

    function handleSend() {
      const text = textarea.value.trim();
      if (!text) return;
      updateBackgroundGlow(false);
      sendPrompt(text);
    }

    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleSend();
      }
    });

    sendBtn.addEventListener('click', handleSend);

    // Copy functionality
    function copyTextToClipboard(text, btn) {
      if (!text) return;
      const clean = text.trim();
      const onSuccess = () => {
        const label = btn.querySelector('.copy-label');
        const origLabel = label ? label.textContent : 'Copy';
        if (label) label.textContent = 'Copied!';
        btn.classList.add('text-amber-400');
        setTimeout(() => {
          if (label) label.textContent = origLabel;
          btn.classList.remove('text-amber-400');
        }, 2000);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(clean).then(onSuccess).catch(() => fallbackCopy(clean, onSuccess));
      } else {
        fallbackCopy(clean, onSuccess);
      }
    }

    function fallbackCopy(text, cb) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        if (cb) cb();
      } catch (e) {}
    }

    document.addEventListener('click', (e) => {
      const copyBtn = e.target.closest('.copy-btn');
      const copyCodeBtn = e.target.closest('.copy-code-btn');

      if (copyBtn) {
        const msgWrapper = copyBtn.closest('.chat-msg-row');
        if (msgWrapper) {
          const textEl = msgWrapper.querySelector('.chat-msg-text');
          if (textEl) copyTextToClipboard(textEl.innerText || textEl.textContent || '', copyBtn);
        }
      } else if (copyCodeBtn) {
        const codeWrapper = copyCodeBtn.closest('.group\\/code');
        if (codeWrapper) {
          const codeEl = codeWrapper.querySelector('code');
          if (codeEl) copyTextToClipboard(codeEl.innerText || codeEl.textContent || '', copyCodeBtn);
        }
      }
    });

    // Status fetch
    fetch(API_BASE + '/api/status')
      .then(res => res.json())
      .then(data => {
        if (data.workspace && workspaceNameEl) workspaceNameEl.textContent = data.workspace;
        if (data.model && modelPillText) {
          const shortModel = data.model.includes('/') ? data.model.split('/')[1] : data.model;
          if (shortModel.toLowerCase().includes('flash')) {
            modelPillText.textContent = 'Flash';
          } else if (shortModel.toLowerCase().includes('free')) {
            modelPillText.textContent = 'Flash';
          } else {
            modelPillText.textContent = shortModel.length > 10 ? 'Flash' : shortModel;
          }
        }
      })
      .catch(() => {});

    // Initialize
    loadLocal();
  })();
</script>
</body></html>
